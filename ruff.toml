# THIS GATE IS CODE QUALITY ONLY. It must never change prompt text.
#
# Prompts are the product. Do NOT select any rule that can rewrite the contents
# of a string literal - ISC (implicit concat), Q (quote style), UP032 (f-string
# conversion), COM, W291/W293, and the D docstring family all can. The current
# select touches control flow, names, and imports; it never edits prose.
# `test_prompt_text_pinned.py` pins every prompt by SHA-256 and will fail if a
# lint or refactor pass alters one, deliberately or not.
#
# Ruff 0.16 enables 413 rules by default (up from 59). We do not take that set:
# flowctl is a 33k-LOC single file with deliberate fail-open error handling, and
# a wholesale style sweep would be churn. This select is correctness-only -
# undefined names, real bug patterns, security. Style rules are out of scope on
# purpose; add one only when it has caught a real defect.
#
# Pin the version in CI. Ruff's default set moves between minor releases.

target-version = "py311"

exclude = [
  # Setup-managed install copy of scripts/. Source of truth is
  # plugins/flow-next/scripts; edits here desync it from MANIFEST.json with no
  # source change to explain them. Never let --fix write into it.
  ".flow",
  # Generated by scripts/sync-codex.sh; fixes here are overwritten on next sync.
  "plugins/flow-next/codex",
  # Deliberate stubs. Broken-on-purpose is the point.
  "plugins/flow-next/tests/fixtures",
  # Throwaway eval harnesses, not shipped.
  "optimization",
  # Other agents' working trees.
  ".worktrees",
  ".claude",
]

[lint]
select = [
  "F",        # pyflakes: undefined names, unused imports, shadowing
  "E9",       # syntax / IO errors
  "PLE",      # pylint errors
  "B",        # bugbear
  "RUF013",   # implicit Optional
  "RUF034",   # useless if-else
  "PLR0124",  # comparison with itself
  "S102",     # exec
  "S307",     # eval
  "PIE810",   # multiple startswith/endswith
]

# Deliberately NOT selected:
#   BLE001  - 44 blind excepts. flowctl fails open by design; this is
#             architecture, not debt. Audit them by hand, not by gate.
#             (One of them hid the NameError fixed in the previous commit, so
#             the audit is worth doing - just not as a blocking gate.)
#   PLW1510 - 85 subprocess.run without check=. Almost all intentional.
#   ISC004  - catches missing commas in collections, which is a real bug class,
#             but all 8 hits here were deliberate multi-line wrapping. Zero
#             signal, 8 reformats. Revisit if a missing comma ever ships.
#   TRY004  - would swap ValueError for TypeError at 4 sites. That is an API
#             change to callers and their tests, not a lint fix. Out of scope
#             for a chore PR; worth its own look.
#   UP/I/SIM - style. See the header.

[lint.per-file-ignores]
# unittest idioms
"plugins/flow-next/tests/*" = ["B011", "B017"]
